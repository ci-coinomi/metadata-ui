# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  # Increase startup timeout significantly
  startupTimeoutSeconds: 600


# Environment variables and secrets.
env:
# PORT is reserved for internal use by Firebase App Hosting
-   variable: HOST
    value: 0.0.0.0
-   variable: METADATA_URL
    value: "https://backend-dev.euclabs.net/metadata-api"
    availability:
      - BUILD
      - RUNTIME
-   variable: COINAPI_WSS
    value: "wss://backend-dev2.euclabs.net/coinapi-websockets"
    availability:
      - BUILD
      - RUNTIME
